site_name: PikeConsole - Documentation
theme:
    name: material
    palette:
        scheme: slate
    features:
        - content.code.copy
        - navigation.tabs
        - navigation.indexes

markdown_extensions:
    - pymdownx.superfences
    - def_list
    - pymdownx.blocks.admonition
    - pymdownx.blocks.details
    - pymdownx.keys
    - pymdownx.tabbed:
          alternate_style: true

nav:
    - Home: index.md
    - Guides:
          - Overview: guides/index.md
          - Project Setup: guides/project_setup.md
          - Getting Started: guides/getting_started.md
          - Logging: guides/logging.md
          - Commands: guides/commands.md
          - Commands list: guides/default_commands.md
          - CVars: guides/cvars.md
    - Architecture & Framework:
          - Overview: architecture/index.md
          - Framework Map: architecture/framework_map.md
          - AOT Safety: architecture/aot_safety.md
          - Benchmarks: architecture/benchmarks.md
          - Godot Interop Bridge: architecture/godot_interop_bridge.md
          - PikeLogger Internals: architecture/pikelogger.md
          - Runtime Executables: architecture/runtime_executables.md
          - Config & I/O: architecture/config_io.md
          - Aliases: architecture/aliases.md
    - API Reference:
          - Overview: api/index.md
          - Logging:
                - LogEvent: api/Logging/LogEvent.md
                - LogLevel: api/Logging/LogLevel.md
                - LogTarget: api/Logging/LogTarget.md
                - PikeLogger: api/Logging/PikeLogger.md
          - Runtime Execution:
                - RegistryBrowser: api/RuntimeExecution/RegistryBrowser.md
                - SearchMode: api/RuntimeExecution/SearchMode.md
                - StatementExecutor: api/RuntimeExecution/StatementExecutor.md
                - ExecutionSource: api/RuntimeExecution/ExecutionSource.md
                - StatementParser: api/RuntimeExecution/StatementParser.md
                - ParsedStatement: api/RuntimeExecution/ParsedStatement.md
                - ArgumentParser: api/RuntimeExecution/ArgumentParser.md
                - IRuntimeExecutable: api/RuntimeExecution/IRuntimeExecutable.md
                - ICVar: api/RuntimeExecution/ICVar.md
                - Response<T>: api/RuntimeExecution/Response_T.md
                - ExecutionResponseStatus: api/RuntimeExecution/ExecutionResponseStatus.md
                - CvarSetResponseStatus: api/RuntimeExecution/CvarSetResponseStatus.md
          - Executable Configs:
                - UserConfigManager: api/RuntimeExecution/Configs/UserConfigManager.md
                - ConfigIO: api/RuntimeExecution/Configs/ConfigIO.md
                - ConfigRef: api/RuntimeExecution/Configs/ConfigRef.md
                - ConfigResponseStatus: api/RuntimeExecution/Configs/ConfigResponseStatus.md
          - Commands:
                - CommandSet: api/RuntimeExecution/Commands/CommandSet.md
          - CVars:
                - Extensions:
                      - CVarBase<T>: api/CVars/Extensions/CVarBase_T.md
                - CVarBool: api/CVars/CVarBool.md
                - CVarDouble: api/CVars/CVarDouble.md
                - CVarEnum: api/CVars/CVarEnum.md
                - CVarFloat: api/CVars/CVarFloat.md
                - CVarInt: api/CVars/CVarInt.md
                - CVarString: api/CVars/CVarString.md
                - CVarColor: api/CVars/CVarColor.md
                - CVarVector2: api/CVars/CVarVector2.md
                - CVarVector2I: api/CVars/CVarVector2I.md
                - CVarVector3: api/CVars/CVarVector3.md
                - CVarVector3I: api/CVars/CVarVector3I.md
                - PersistentCVarRegistry: api/CVars/PersistentCVarRegistry.md
